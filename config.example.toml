# =============================================================================
#  Настройки VK-бота записи на массаж
#  Скопируйте: cp config.example.toml config.toml   и отредактируйте под себя.
#  Секреты (ключ сообщества) хранятся в .env, а не здесь!
# =============================================================================

[bot]
name = "Массаж · запись"
timezone = "Europe/Moscow"     # часовой пояс мастера (важно для слотов!)
api_version = "5.198"
log_level = "INFO"             # DEBUG пока настраиваете, INFO в работе

[vk]
# Лучше задать в .env: VK_GROUP_ID=123456789
group_id = 0
# token = ""   # НЕ пишите ключ сюда — он уедет в git. Только .env

[storage]
db_path = "data/massage.sqlite3"

# -----------------------------------------------------------------------------
#  Услуги: сколько угодно, каждая со своей длительностью и ценой.
#  active = false — услуга скрыта из меню, но история записей сохраняется.
# -----------------------------------------------------------------------------
[[services]]
id = "back"
title = "Массаж спины"
duration = 40          # минут
price = 1500           # ₽
description = "Шейно-воротниковая зона, спина, поясница"
active = true

[[services]]
id = "full"
title = "Общий массаж"
duration = 60
price = 2500
description = "Всё тело, классическая техника"
active = true

[[services]]
id = "anticell"
title = "Антицеллюлитный массаж"
duration = 60
price = 2200
description = "Бёдра, ягодицы, живот. Курс от 10 сеансов"
active = true

[[services]]
id = "face"
title = "Массаж лица"
duration = 30
price = 1200
description = "Скульптурный, лимфодренаж"
active = true

# -----------------------------------------------------------------------------
#  Расписание. Дни: mon tue wed thu fri sat sun
#  Интервалы — в формате "ЧЧ:ММ-ЧЧ:ММ", можно несколько в день.
#  Пустой список = выходной.
# -----------------------------------------------------------------------------
[schedule]
work_days = ["mon", "tue", "wed", "thu", "fri", "sat"]
slot_minutes = 30          # шаг сетки: клиент видит 10:00, 10:30, 11:00…
buffer_minutes = 15        # пауза между сеансами (подготовка, отдых)
min_notice_minutes = 120   # за сколько часов минимум можно записаться
max_days_ahead = 21        # на сколько дней вперёд открывать запись
block_on_pending = true    # заявка без подтверждения уже держит слот

[schedule.hours]
mon = ["10:00-14:00", "15:00-19:00"]
tue = ["10:00-19:00"]
wed = ["10:00-14:00", "15:00-19:00"]
thu = ["10:00-19:00"]
fri = ["10:00-18:00"]
sat = ["11:00-16:00"]
sun = []                   # воскресенье — выходной

# -----------------------------------------------------------------------------
#  Контакты мастера. Это то, что видит клиент в разделе «Связаться»
#  и что приходит мастеру вместе с заявкой (чтобы списаться вживую).
# -----------------------------------------------------------------------------
[contacts]
master_name = "Елена"
phone = "+7 900 000-00-00"
whatsapp = "https://wa.me/79000000000"
telegram = ""                      # например https://t.me/elena_massage
vk = "https://vk.com/id000000000"  # личная страница мастера
address = "г. Тверь, ул. Советская, 10, каб. 5"
how_to_find = "Вход со двора, 2 этаж, домофон 5"
note = "Приходите за 5 минут до начала. Отмена/перенос — за 3 часа."

# -----------------------------------------------------------------------------
#  Мастер (админ). vk_id — числовой id страницы, узнать: scripts/doctor.py
#  Можно несколько: уведомления придут всем.
#  Лучше задать в .env: ADMIN_VK_IDS=123456,654321
# -----------------------------------------------------------------------------
[admin]
vk_ids = []
notify_on_request = true   # слать уведомление о каждой новой заявке
notify_on_cancel = true    # слать уведомление, если клиент отменил запись

# -----------------------------------------------------------------------------
#  Напоминания. Всё настраивается: сколько, кому и за сколько часов.
# -----------------------------------------------------------------------------
[reminders]
client_before_hours = [24, 2]   # клиенту: за сутки и за 2 часа. [] — выключить
admin_before_hours = [24]       # мастеру: за сутки. [] — выключить
digest_enabled = true           # утренний список записей на день
digest_time = "09:00"
pending_ttl_hours = 24          # через сколько заявка без ответа закрывается

# -----------------------------------------------------------------------------
#  Правила записи
# -----------------------------------------------------------------------------
[policy]
client_cancel_min_hours = 3    # позже этого срока клиент сам отменить не может
max_active_requests = 2        # сколько заявок/записей одновременно у одного человека
cooldown_seconds = 2           # анти-спам: пауза между сообщениями от одного человека
use_callback_buttons = true    # inline-кнопки у мастера (false = обычные текстовые)

# -----------------------------------------------------------------------------
#  Тексты сообщений. Можно переписать под свой тон — плейсхолдеры в {}
#  подставятся автоматически. Список всех плейсхолдеров: docs/TEXTS.md
#  Любой ключ можно удалить — тогда возьмётся встроенный текст по умолчанию.
# -----------------------------------------------------------------------------
[texts]
greeting = """
Здравствуйте, {name}! 🌿
Это бот записи на массаж к мастеру {master}.

Выберите удобное время и оставьте заявку — {master} подтвердит её лично
и напишет вам, если нужно что-то уточнить.

Что сделать?
"""

request_created = """
✅ Заявка отправлена!

🔹 {title}
📅 {when}

{master} проверит расписание и подтвердит запись — обычно в течение {ttl}.
Я напишу вам сюда сразу, как только она ответит.

Если нужно что-то уточнить или поменять время — мастеру можно написать напрямую:
{contacts}
"""

approved_client = """
🎉 Запись подтверждена!

🔹 {title}
📅 {when}
💰 {price}
📍 {address}

Пожалуйста, приходите за 5 минут до начала.
Если планы изменились — отмените запись в разделе «Мои записи»
или напишите мастеру: {phone}
"""

reminder_client = """
⏰ Напоминание: {title}
📅 {when}
📍 {address}

Если планы изменились — отмените запись в разделе «Мои записи»
или напишите мастеру: {phone}
"""

new_request_admin = """
🔔 НОВАЯ ЗАЯВКА №{id}

🔹 {title} ({duration} мин, {price})
📅 {when}
👤 {name}
📱 {contact}
💬 Написать клиенту: {dialog}
📝 Комментарий: {comment}

Подтвердить или отклонить — кнопками ниже.
"""

digest = """
📋 Записи на {date}:

{list}
"""

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agpatch"
version = "0.1.0"
description = "Local region-gate patcher for Antigravity: verified writes, pristine backups, no elevation, no network"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["antigravity", "patcher", "reverse-engineering", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.scripts]
agpatch = "agpatch.cli:main"

[tool.setuptools]
packages = ["agpatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
